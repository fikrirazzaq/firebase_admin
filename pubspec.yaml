name: firebase_admin
description: A port of the Firebase admin sdk to pure, idiomatic Dart code
version: 0.3.0-dev.4
homepage: https://github.com/appsup-dart/firebase_admin

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  clock: ^1.1.2
  x509: ^0.2.4+3
  jose: ^0.3.4
  dotenv: ^4.2.0
  openid_client: ^0.4.9
  firebase_dart: ^1.3.4
  path: ^1.9.1
  meta: ^1.16.0
  http: ^1.3.0
  crypto_keys: ^0.3.0+1
  collection: ^1.19.1
  gcloud: ^0.8.18
  firebaseapis: ^0.2.0
  snapshot: ^0.2.6+2
  _discoveryapis_commons: ^1.0.7
  googleapis: ^13.2.0

dev_dependencies:
  test: ^1.25.15
  fake_async: ^1.3.3
  lints: ^5.1.1
  mockito: ^5.4.5

false_secrets:
  - /lib/src/testing.dart
